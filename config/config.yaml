services:
  litellm:
    base_url: "http://192.168.3.51:4000"
    api_key: "sk-vllm"

  stt:
    base_url: "ws://192.168.3.51:9091/asr"
    type: "websocket"
    chunk_ms: 250
    sample_rate: 16000
    channels: 1

  tts:
    base_url: "http://192.168.3.51:8880"
    voice: "af_heart"
    type: "http_stream"

  vision:
    base_url: "http://192.168.3.51:4000"
    type: "openai_compatible"

models:
  chat: "Qwen/Qwen2.5-VL-7B-Instruct"    # ← was Qwen2.5-7B-Instruct
  classifier: "Qwen/Qwen2.5-1.5B-Instruct"
  vision: "Qwen/Qwen2.5-VL-7B-Instruct"
  embedding: "BAAI/bge-m3"

memory:
  db_path: "./data/memory.db"
  retrieval_top_k: 5
  context_budget_tokens: 800

vision_pipeline:
  frame_interval_ms: 5000           # 5s — Aria always knows what's on screen
  frame_interval_active_ms: 5000
  frame_interval_speaking_ms: 10000 # back off while speaking
  max_pixels: 1280
  jpeg_quality: 75

logging:
  level: "INFO"
  path: "./logs/eyes_and_ears.log"