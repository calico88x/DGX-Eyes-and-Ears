# config/params.example.yaml
#
# Copy to config/params.yaml and adjust for your setup.
# config/params.yaml is gitignored — audio device IDs are machine-specific.

chat_llm:
  temperature: 0.85
  max_tokens: 35          # keep short for reactive companion feel
  top_p: 0.95
  repetition_penalty: 1.1
  stream: true

classifier_llm:
  temperature: 0.1
  max_tokens: 150
  top_p: 0.9
  stream: false

vision_model:
  temperature: 0.4
  max_tokens: 300
  stream: false

embedding_model:
  dimensions: 1536

classifier_thresholds:
  speech_respond_threshold:  0.60
  stream_react_threshold:    0.70
  stream_override_threshold: 0.85
  stream_interrupt_threshold: 0.90

audio:
  # Find device IDs:  python -c "import sounddevice; print(sounddevice.query_devices())"
  output_device: null   # null = system default. Set to device index or name substring.
  input_device: null    # null = system default. Set to your microphone device.
